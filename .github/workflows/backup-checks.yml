name: Backup recorder checks
on:
  push:
    paths: ['backup/**', '.github/workflows/backup-checks.yml']
  pull_request:
    paths: ['backup/**', '.github/workflows/backup-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q backup
      - name: Test processing locks, stop controls, and local API
        run: python -m unittest discover -s backup/tests -v
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/backup/Install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
      - name: Validate Mac launcher syntax
        if: runner.os == 'macOS'
        run: bash -n backup/Install.command && bash -n 'backup/Start Backup.command'
